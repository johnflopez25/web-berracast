<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="400" height="340">
  <rect width="100%" height="100%" rx="16" fill="#121214" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.15"/>
  <circle cx="45" cy="45" r="20" fill="#a855f7"/>
  <text x="45" y="51" font-family="system-ui, sans-serif" font-size="16" font-weight="black" fill="#ffffff" text-anchor="middle">S</text>
  <text x="80" y="40" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Sofía Castro</text>
  <text x="80" y="56" font-family="system-ui, sans-serif" font-size="11" fill="#71717a">Creadora de Contenido</text>
  <rect x="25" y="85" width="350" height="220" rx="12" fill="#1a1a1e"/>
  <text x="40" y="115" font-family="system-ui, sans-serif" font-size="13" fill="#e4e4e7" font-weight="medium">
    <tspan x="40" dy="0">¡Hola Carlos! Te escribo para agradecerte.</tspan>
    <tspan x="40" dy="22">Llevaba meses dando vueltas a la idea de</tspan>
    <tspan x="40" dy="22">lanzar mi canal en Spotify y siempre me</tspan>
    <tspan x="40" dy="22">frenaba la edición. Con tu flujo de</tspan>
    <tspan x="40" dy="22">edición rápida con IA y los scripts de</tspan>
    <tspan x="40" dy="22">estructura, edité el episodio 1 en solo</tspan>
    <tspan x="40" dy="22">25 minutos. ¡Es una locura total!</tspan>
    <tspan x="40" dy="22">Recomendadísimo el taller.</tspan>
  </text>
  <text x="360" y="293" font-family="system-ui, sans-serif" font-size="10" fill="#71717a" text-anchor="end">3:15 PM</text>
</svg>
